<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SpinFrame</title>
  <style>
    :root { color-scheme: dark; --accent:#c7ff43; --panel:#18181b; --muted:#a1a1aa; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { position:fixed; inset:0; width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; background:#09090b; font-family:ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    body { padding:0; touch-action:manipulation; }
    button, input { font:inherit; }
    .app { width:100%; height:100%; height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden; }
    header { display:flex; align-items:center; justify-content:space-between; padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left)); z-index:2; }
    .brand { font-size:20px; font-weight:850; letter-spacing:-.5px; }
    .badge { color:var(--muted); font-size:12px; font-weight:650; }
    .stage { position:relative; display:grid; place-items:center; overflow:hidden; min-height:0; touch-action:none; }
    .stage::before { content:""; position:absolute; inset:10%; border:1px dashed #27272a; border-radius:50%; pointer-events:none; }
    .video-shell { position:absolute; left:50%; top:50%; width:min(70vmin,72vw); height:min(70vmin,72vw); display:grid; place-items:center; transform:translate(-50%,-50%) rotate(0deg); transform-origin:center; will-change:transform; }
    video { display:none; max-width:100%; max-height:100%; object-fit:contain; border-radius:10px; background:#000; box-shadow:0 18px 60px #000a; }
    .empty { width:min(78vw,340px); text-align:center; color:var(--muted); z-index:1; }
    .empty-icon { width:70px; height:70px; margin:0 auto 16px; display:grid; place-items:center; border-radius:22px; background:#18181b; color:var(--accent); font-size:31px; }
    .empty strong { display:block; color:#fafafa; font-size:18px; margin-bottom:6px; }
    .empty p { margin:0 0 18px; font-size:14px; line-height:1.4; }
    .pick { border:0; border-radius:14px; background:var(--accent); color:#111; padding:13px 18px; font-weight:800; cursor:pointer; }
    .fullscreen-button { position:absolute; top:12px; right:12px; z-index:5; min-height:42px; border:1px solid #3f3f46; border-radius:12px; padding:0 13px; background:#18181be8; color:#fafafa; font-weight:750; font-size:13px; backdrop-filter:blur(12px); cursor:pointer; }
    input[type=file] { display:none; }
    .controls { background:linear-gradient(180deg,#18181bf2,#111113); border-top:1px solid #29292d; border-radius:24px 24px 0 0; padding:16px 16px calc(15px + env(safe-area-inset-bottom)); z-index:3; box-shadow:0 -12px 40px #0007; }
    .speed-row { display:flex; align-items:end; justify-content:space-between; margin-bottom:10px; }
    .label { color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; }
    .speed-value { color:var(--accent); font-size:25px; font-weight:850; line-height:1; font-variant-numeric:tabular-nums; }
    .speed-value small { font-size:12px; color:var(--muted); }
    input[type=range] { width:100%; margin:0 0 17px; accent-color:var(--accent); height:28px; }
    .range-limits { display:flex; justify-content:space-between; margin:-17px 2px 13px; color:#71717a; font-size:10px; font-weight:700; }
    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .direction { display:grid; grid-template-columns:1fr 1fr; background:#27272a; border-radius:13px; padding:3px; gap:3px; }
    .direction button, .transport button { min-height:48px; border:0; border-radius:10px; color:#d4d4d8; background:transparent; font-weight:750; cursor:pointer; }
    .direction button.active { background:#fafafa; color:#111; }
    .transport { display:grid; grid-template-columns:1fr 48px; gap:8px; }
    #spinButton { background:var(--accent); color:#111; }
    #changeButton { background:#27272a; color:#fff; font-size:20px; }
    button:active { transform:scale(.97); }
    button:disabled { opacity:.4; }
    body.focus-mode { padding:0; }
    body.focus-mode .stage { position:fixed; inset:0; width:100vw; height:100dvh; z-index:100; background:#09090b; }
    body.focus-mode .stage::before { inset:8%; }
    body.focus-mode .video-shell { width:min(84vmin,88vw); height:min(84vmin,88vw); }
    body.focus-mode .fullscreen-button { top:calc(12px + env(safe-area-inset-top)); right:calc(12px + env(safe-area-inset-right)); }
    @media (orientation:landscape) and (max-height:520px) {
      .app { grid-template-columns:minmax(0,1fr) 330px; grid-template-rows:auto minmax(0,1fr); }
      header { grid-column:1; }
      .stage { grid-column:1; }
      .controls { grid-column:2; grid-row:1/3; border-radius:24px 0 0 24px; border-top:0; border-left:1px solid #29292d; align-self:stretch; display:flex; flex-direction:column; justify-content:center; }
      .video-shell { width:min(62vmin,48vw); height:min(62vmin,48vw); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header><div class="brand">SpinFrame</div><div class="badge">VIDEO ROTATOR</div></header>
    <section class="stage" id="stage">
      <button class="fullscreen-button" id="fullscreenButton" type="button" aria-label="Enter fullscreen">⛶ Full screen</button>
      <div class="empty" id="empty">
        <div class="empty-icon">↻</div>
        <strong>Choose a video</strong>
        <p>Your video stays on your device. Pick one to start spinning.</p>
        <button class="pick" id="pickButton">Select video</button>
      </div>
      <div class="video-shell" id="videoShell"><video id="video" playsinline loop controls></video></div>
    </section>
    <section class="controls">
      <div class="speed-row"><span class="label">Rotation speed</span><span class="speed-value"><span id="speedValue">10</span> <small>RPM</small></span></div>
      <input id="speed" type="range" min="0" max="300" step="1" value="10" aria-label="Rotation speed, up to 300 RPM">
      <div class="range-limits" aria-hidden="true"><span>0 RPM</span><span>300 RPM</span></div>
      <div class="buttons">
        <div class="direction" aria-label="Rotation direction">
          <button id="ccw" type="button">↶ CCW</button>
          <button id="cw" class="active" type="button">CW ↷</button>
        </div>
        <div class="transport">
          <button id="spinButton" type="button" disabled>Start</button>
          <button id="changeButton" type="button" aria-label="Choose another video">＋</button>
        </div>
      </div>
    </section>
    <input id="fileInput" type="file" accept="video/*">
  </main>
  <script>
    const fileInput = document.querySelector('#fileInput');
    const pickButton = document.querySelector('#pickButton');
    const changeButton = document.querySelector('#changeButton');
    const video = document.querySelector('#video');
    const shell = document.querySelector('#videoShell');
    const empty = document.querySelector('#empty');
    const speed = document.querySelector('#speed');
    const speedValue = document.querySelector('#speedValue');
    const spinButton = document.querySelector('#spinButton');
    const cw = document.querySelector('#cw');
    const ccw = document.querySelector('#ccw');
    const stage = document.querySelector('#stage');
    const fullscreenButton = document.querySelector('#fullscreenButton');

    let direction = Number(localStorage.getItem('spinframe-direction')) || 1;
    let rpm = Math.min(300, Number(localStorage.getItem('spinframe-speed')) || 10);
    let spinning = false, angle = 0, lastTime = 0, frame = 0, objectUrl = null;
    speed.value = rpm; speedValue.textContent = rpm;

    function setDirection(value) {
      direction = value; localStorage.setItem('spinframe-direction', value);
      cw.classList.toggle('active', value === 1); ccw.classList.toggle('active', value === -1);
    }
    setDirection(direction);

    function animate(now) {
      if (!lastTime) lastTime = now;
      const elapsed = Math.min(now - lastTime, 100); lastTime = now;
      angle = (angle + direction * rpm * 360 / 60000 * elapsed) % 360;
      shell.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
      if (spinning) frame = requestAnimationFrame(animate);
    }

    function setSpinning(value) {
      spinning = value; spinButton.textContent = value ? 'Pause' : 'Start';
      cancelAnimationFrame(frame); lastTime = 0;
      if (value) frame = requestAnimationFrame(animate);
    }

    function chooseVideo() { fileInput.click(); }

    function updateFullscreenButton() {
      const active = document.body.classList.contains('focus-mode');
      fullscreenButton.textContent = active ? '× Exit' : '⛶ Full screen';
      fullscreenButton.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
    }

    async function toggleFullscreen() {
      const active = document.body.classList.contains('focus-mode');
      if (active) {
        document.body.classList.remove('focus-mode');
        if (document.fullscreenElement && document.exitFullscreen) {
          try { await document.exitFullscreen(); } catch (_) {}
        }
      } else {
        document.body.classList.add('focus-mode');
        if (stage.requestFullscreen) {
          try { await stage.requestFullscreen({ navigationUI: 'hide' }); } catch (_) {}
        }
      }
      updateFullscreenButton();
    }

    pickButton.addEventListener('click', chooseVideo);
    changeButton.addEventListener('click', chooseVideo);
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0]; if (!file) return;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file); video.src = objectUrl;
      video.style.display = 'block'; empty.style.display = 'none'; spinButton.disabled = false;
      video.play().catch(() => {}); setSpinning(true);
    });
    speed.addEventListener('input', () => {
      rpm = Number(speed.value); speedValue.textContent = rpm;
      localStorage.setItem('spinframe-speed', rpm);
    });
    cw.addEventListener('click', () => setDirection(1));
    ccw.addEventListener('click', () => setDirection(-1));
    spinButton.addEventListener('click', () => setSpinning(!spinning));
    fullscreenButton.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) document.body.classList.remove('focus-mode');
      updateFullscreenButton();
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden && spinning) { cancelAnimationFrame(frame); lastTime = 0; } else if (!document.hidden && spinning) frame = requestAnimationFrame(animate); });
  </script>
</body>
</html>
